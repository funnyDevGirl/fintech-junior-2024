name: Currency Converter CI

on:
  pull_request:
    paths:
      - currency-converter/**

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        working-directory: currency-converter
        run: ./gradlew build

      - name: Run tests
        working-directory: currency-converter
        run: ./gradlew test

      - name: Publish code coverage
        uses: paambaati/codeclimate-action@v5.0.0
        env:
          CC_TEST_REPORTER_ID: ${{secrets.CC_TEST_REPORTER_ID}}
          JACOCO_SOURCE_PATH: currency-converter/src/main/java
        with:
          coverageCommand: ./gradlew jacocoTestReport
          coverageLocations: ${{github.workspace}}/currency-converter/build/reports/jacoco/test/jacocoTestReport.xml:jacoco

      - name: Static code analysis with Checkstyle
        working-directory: currency-converter
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Build Docker image
        run: docker build -t currency-converter -f currency-converter/Dockerfile .

      - name: Log in to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          token: ${{ secrets.TOKEN_FOR_PACKAGES }}

      - name: Push Docker image to GitHub Packages
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}/currency-converter:${{ github.sha }}"
          docker tag currency-converter $IMAGE_NAME
          docker push $IMAGE_NAME
