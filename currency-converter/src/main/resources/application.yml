spring:
  jpa:
    generate-ddl: true
    show-sql: true
    hibernate:
      ddl-auto: create

  output:
    ansi:
      enabled: always

  sql:
    init:
      mode: always
  profiles:
    default: dev

  cache:
    caffeine:
      spec: expireAfterWrite=1h

  mail:
    host: smtp.example.com # Адрес SMTP-сервера (например, smtp.gmail.com для Gmail)
    port: 587 # Порт для TLS
    username: myemail@gmail.com
    password: mypassword
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

logging:
  level:
    root: INFO

resilience4j:
  circuitbreaker:
    instances:
      CurrencyRateService:
        registerHealthIndicator: true  # следить за состоянием Circuit Breaker через Actuator
        slidingWindowSize: 20          # размер скользящего окна
        minimumNumberOfCalls: 10
        failureRateThreshold: 50       # процент ошибок для открытого состояния
        waitDurationInOpenState: 10000 # время ожидания в открытом состоянии (10 секунд)

# включаю эндпоинты для Actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"

    health:
      show-details: always

  health:
    circuitbreakers:
      enabled: true

    ratelimiters:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

cb-api-url: "http://www.cbr.ru/scripts/XML_daily.asp?date_req="

rsa:
  private-key: classpath:certs/private.pem
  public-key: classpath:certs/public.pem

default-role: "USER"
